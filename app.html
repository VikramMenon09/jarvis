<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
:root{color-scheme:dark;--bg:#000;--text:#f5f5f7;--dim:#86868b;--faint:#48484a;--hair:rgba(255,255,255,.1);--glass:rgba(28,28,30,.72)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.drag{cursor:grabbing}canvas.hot{cursor:pointer}

/* title bar: the top 44px belongs to the window (drag it to move) */
.bar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:linear-gradient(#000 30%,transparent)}
.bar .title{font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--text)}
.pill{position:absolute;right:14px;top:10px;height:24px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:12px;
  background:var(--glass);border:.5px solid var(--hair);font-size:12px;color:var(--dim);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--faint);transition:background .2s}
.pill.live i{background:#fff}

/* bottom: what was said, then one capsule */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 24px 20px;pointer-events:none;
  background:linear-gradient(transparent,rgba(0,0,0,.86) 38%,#000 78%)}
#heard{color:var(--dim);font-size:13px;max-width:620px;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#said{max-width:620px;width:100%;text-align:center;font-size:17px;line-height:1.42;letter-spacing:-.01em;max-height:22vh;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;
  pointer-events:auto;-webkit-user-select:text;user-select:text;scrollbar-width:none}
#said::-webkit-scrollbar{display:none}
#heard:empty,#said:empty{display:none}
.capsule{pointer-events:auto;display:flex;align-items:center;gap:2px;width:100%;max-width:460px;height:44px;padding:0 6px;border-radius:22px;
  background:var(--glass);border:.5px solid var(--hair);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 8px 30px rgba(0,0,0,.5);transition:border-color .2s}
.capsule:focus-within{border-color:rgba(255,255,255,.28)}
#q{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:14px;padding:0 8px;height:100%}
#q::placeholder{color:#636366}
#q:focus{outline:none}
.icon{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.icon:hover{background:rgba(255,255,255,.08);color:var(--text)}
.icon:focus-visible{outline:1.5px solid rgba(255,255,255,.6);outline-offset:1px}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="true"]{background:#fff;color:#000}
.icon.off{color:var(--faint)}
.hint{font-size:11px;color:#636366;height:14px}
kbd{font:inherit;border:.5px solid var(--faint);border-radius:4px;padding:0 5px;color:var(--dim)}
#heard,#said{transition:opacity .9s}
.dock.quiet #heard,.dock.quiet #said{opacity:0}
#history{position:fixed;left:16px;bottom:20px;pointer-events:auto;background:var(--glass);border:.5px solid var(--hair);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#drawer{position:fixed;top:52px;right:12px;bottom:12px;width:340px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;border-radius:16px;background:rgba(22,22,24,.82);
  border:.5px solid var(--hair);-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);box-shadow:0 20px 60px rgba(0,0,0,.6);
  transform:translateX(calc(100% + 24px));transition:transform .32s cubic-bezier(.2,.8,.2,1);-webkit-user-select:text;user-select:text}
#drawer.open{transform:none}
#drawer>header{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 10px 16px;font-size:13px;font-weight:600;border-bottom:.5px solid var(--hair)}
#hist{flex:1;overflow-y:auto;padding:6px 16px 16px;font-size:13px;color:var(--dim)}
#hist article{padding:12px 0;border-bottom:.5px solid rgba(255,255,255,.06)}
#hist article header{font-size:11px;color:#636366;margin-bottom:4px}
#hist p{margin:0 0 4px;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
#hist p.u{color:var(--dim)}
#hist p.none{color:var(--dim);margin-top:14px}
@media (prefers-reduced-motion:reduce){#drawer,#heard,#said{transition:none}}
#center{position:fixed;right:16px;bottom:20px;pointer-events:auto;background:var(--glass);border:.5px solid var(--hair);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><span class="title">Jarvis</span><span class="pill" id="pill"><i></i><span id="status">Connecting</span></span></div>
<div class="dock" id="dock">
  <div id="heard"></div>
  <div id="said"></div>
  <div class="capsule">
    <button class="icon" id="mic" aria-pressed="false" aria-label="Talk" title="Talk (Space)"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg></button>
    <input id="q" placeholder="Ask Jarvis" aria-label="Message" autocomplete="off">
    <button class="icon" id="mute" aria-label="Spoken replies" title="Spoken replies"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path id="waves" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg></button>
  </div>
  <div class="hint" id="hint">Press <kbd>Space</kbd> to talk · scroll to zoom · drag to move</div>
</div>
<button class="icon" id="history" aria-label="Conversation history" title="Conversation history"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg></button>
<aside id="drawer" aria-label="Conversation history"><header>Conversation<button class="icon" id="closeHist" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div id="hist"></div></aside>
<button class="icon" id="center" aria-label="Recentre" title="Recentre (⌘0)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg></button>

<script>
const TOKEN = '{{TOKEN}}';
const $ = id => document.getElementById(id);
const api = (m, r, b) => fetch(r, { method: m, headers: { 'x-jarvis-token': TOKEN, 'content-type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(r => r.json());
const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jarvis;
const tell = (cmd, extra) => bridge && bridge.postMessage({ cmd, ...extra });
const keep = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
if (!bridge) { $('mic').hidden = true; $('hint').textContent = ''; }

/* ---------- state ---------- */
let mode = 'idle';                 // idle | listening | thinking | speaking
let level = 0, target = 0;         // voice loudness 0..1, drives the orb
let busy = false, last = 0, notice = '';
let voiceOn = keep.get('voice', true), voiceName = '';
function paintVoice(){ $('mute').classList.toggle('off', !voiceOn); $('waves').style.display = voiceOn ? '' : 'none'; }
paintVoice();

/* ---------- talking ---------- */
function speak(text){
  const clean = text.replace(/[*_#`>]/g, '').slice(0, 4000);
  if (!voiceOn || !clean.trim()) { setMode('idle'); return; }
  if (bridge) tell('speak', { text: clean, voice: voiceName });
  else if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(clean); u.onstart = () => setMode('speaking'); u.onend = () => setMode('idle'); speechSynthesis.speak(u); }
  else setMode('idle');
}
let fadeTimer = 0;
function showText(){ clearTimeout(fadeTimer); $('dock').classList.remove('quiet'); }
function fadeSoon(ms){ clearTimeout(fadeTimer); fadeTimer = setTimeout(() => $('dock').classList.add('quiet'), ms); }   // what was said lives on in the history panel
function setMode(m){
  if (m === 'idle' && mode !== 'idle') fadeSoon(mode === 'speaking' ? 5000 : 12000); else if (m !== 'idle') showText();
  mode = m; if (m === 'idle') target = 0;
  $('mic').setAttribute('aria-pressed', m === 'listening');
  paintStatus();
}
function paintStatus(){
  $('status').textContent = notice || ({ idle: 'Ready', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking' })[mode];
  $('pill').classList.toggle('live', mode !== 'idle');
}
async function send(text){
  text = text.trim(); if (!text || busy) return;
  busy = true; tell('stopSpeak'); $('hint').textContent = ''; $('heard').textContent = text; $('said').textContent = ''; setMode('thinking');
  try { const r = await api('POST', '/api/ask', { text }); const reply = r.reply || r.error || 'No answer.'; $('said').textContent = reply; speak(reply); loadAccess(); }
  catch { $('said').textContent = 'I cannot reach my own service. Check that Jarvis is still running.'; setMode('idle'); }
  busy = false;
}
function toggleListen(){
  if (!bridge || busy) return;
  if (mode === 'listening') tell('stopListen');
  else { tell('stopSpeak'); $('heard').textContent = ''; setMode('listening'); tell('listen'); }
}
window.native = m => {
  if (m.type === 'level') target = Math.min(1, m.v);
  else if (m.type === 'partial') $('heard').textContent = m.text;
  else if (m.type === 'final') { setMode('idle'); if (m.text) send(m.text); }
  else if (m.type === 'speakStart') setMode('speaking');
  else if (m.type === 'speakEnd') { if (mode === 'speaking') setMode('idle'); }
  else if (m.type === 'error') { setMode('idle'); $('said').textContent = m.text; }
};
window.jarvisCmd = c => {
  if (c === 'center') { touched = false; camTo = { ...HOME }; }
  else if (c === 'history') openHistory();
  else if (c === 'new') api('POST', '/api/reset').then(() => { $('heard').textContent = ''; $('said').textContent = 'New conversation.'; });
};
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = $('q').value; $('q').value = ''; $('q').blur(); send(v); } else if (e.key === 'Escape') $('q').blur(); e.stopPropagation(); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  if (e.code === 'Space') { e.preventDefault(); toggleListen(); }
  else if (e.key === 'Escape') { tell('stopSpeak'); tell('stopListen'); $('drawer').classList.remove('open'); }
  else if (e.key.length === 1) $('q').focus();
});
$('mic').addEventListener('click', toggleListen);
$('mute').addEventListener('click', () => { voiceOn = !voiceOn; keep.set('voice', voiceOn); paintVoice(); if (!voiceOn) tell('stopSpeak'); });
$('center').addEventListener('click', () => window.jarvisCmd('center'));

/* ---------- the web of everything Jarvis can reach ---------- */
// Jarvis in the middle, a hub for each kind of thing, and each hub's items fanned out beyond it in arcs.
// Straight threads run outward and fainter strands tie neighbours together, like a spider's web.
const R1 = 330, GAPX = 132, GAPR = 66;
let roots = [], flat = [];
const pos = new Map();             // key -> {x,y} so the web glides when it changes
function add(n, x, y, depth, parent, a){
  n.tx = x; n.ty = y; n.depth = depth; n.parent = parent; n.a = a;
  const p = pos.get(n.key) || (parent ? { x: parent.x, y: parent.y } : { x, y });
  n.x = p.x; n.y = p.y; n.la = n.la || 0; flat.push(n);
}
function layout(){
  for (const n of flat) pos.set(n.key, { x: n.x, y: n.y });
  flat = [];
  const wt = g => Math.pow(Math.max(3, g.children.length), .8), total = roots.reduce((t, g) => t + wt(g), 0);
  let a = -Math.PI / 2 - (roots[0] ? wt(roots[0]) / total * Math.PI : 0);
  for (const g of roots){
    const span = wt(g) / total * 6.283, a0 = a + span / 2, sector = span * .72; a += span;
    add(g, Math.cos(a0) * R1, Math.sin(a0) * R1, 0, null, a0);
    g.rows = [];
    for (let i = 0, row = 0; i < g.children.length; row++){
      const r = R1 + 125 + row * GAPR, cap = Math.max(1, Math.floor(sector * r / GAPX)), n = Math.min(cap, g.children.length - i), line = [];
      for (let k = 0; k < n; k++){
        const ang = a0 + (n === 1 ? 0 : (k / (n - 1) - .5) * sector * Math.min(1, n / cap)) + (row % 2 ? sector / Math.max(cap, 2) * .25 : 0);
        const c = g.children[i++]; add(c, Math.cos(ang) * r, Math.sin(ang) * r, 1, g, ang); line.push(c);
        const kids = c.children || [], m = kids.length;      // a site's accounts burst outward from it
        kids.forEach((gc, j) => { const off = m === 1 ? 0 : (j / (m - 1) - .5) * Math.min(1.5, .4 * m), rr = 84 + (j % 2) * 30; add(gc, c.tx + Math.cos(ang + off) * rr, c.ty + Math.sin(ang + off) * rr, 2, c, ang + off); });
      }
      g.rows.push(line);
    }
  }
}
function adopt(groups){
  const key = (n, path) => { n.key = path + '/' + n.label; (n.children || []).forEach(c => key(c, n.key)); };
  const old = new Map(flat.map(n => [n.key, n.la]));
  roots = groups.map(g => ({ label: g.label, hub: true, children: g.items }));
  roots.forEach(r => key(r, ''));
  const carry = n => { n.la = old.get(n.key) || 0; (n.children || []).forEach(carry); }; roots.forEach(carry);
  layout();
}
async function loadAccess(){ try { adopt((await api('GET', '/api/access')).groups); } catch {} }
loadAccess(); setInterval(loadAccess, 20000);

/* ---------- camera: wheel zooms, drag moves ---------- */
const cv = $('c'), cx = cv.getContext('2d');
var HOME = { x: 0, y: 30, z: .6 };
var W = 0, H = 0, cam = { ...HOME }, camTo = null, touched = false;
function fit(){
  HOME.z = Math.min(1, Math.max(.5, Math.min(W, H - 120) / 1000)); HOME.y = 26 / HOME.z;
  if (!touched) cam = { ...HOME };
}
function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); fit(); }
addEventListener('resize', size); size();
const toWorld = (sx, sy) => ({ x: (sx - W / 2) / cam.z + cam.x, y: (sy - H / 2) / cam.z + cam.y });
const toScreen = n => [(n.x - cam.x) * cam.z + W / 2, (n.y - cam.y) * cam.z + H / 2];
const clamp01 = v => Math.max(0, Math.min(1, v));
const reveal2 = () => clamp01((cam.z - .9) / .3);          // sub-branches appear as you lean in
const FONT = '12px -apple-system,"SF Pro Text","Helvetica Neue",sans-serif', FONT_HUB = '600 11px -apple-system,"SF Pro Text","Helvetica Neue",sans-serif', FONT_SUB = '10px -apple-system,"SF Pro Text","Helvetica Neue",sans-serif';
const widths = new Map();
const shown = n => n.hub ? n.label.toUpperCase() : n.label.length > 24 ? n.label.slice(0, 23) + '…' : n.label;
function textW(n){ const k = n.label + (n.hub ? '!' : ''); let w = widths.get(k); if (w == null){ cx.font = n.hub ? FONT_HUB : FONT; try { cx.letterSpacing = n.hub ? '2px' : '0px'; } catch {} w = cx.measureText(shown(n)).width; try { cx.letterSpacing = '0px'; } catch {} widths.set(k, w); } return w; }
let drag = null, hover = null;
function pick(sx, sy){
  const p = toWorld(sx, sy);
  if (Math.hypot(p.x, p.y) < 150) return 'orb';
  let best = null, bd = 12;
  for (const n of flat){
    if (n.depth === 2 && reveal2() < .3) continue;
    const b = n.box;
    if (b && n.la > .4 && sx >= b[0] && sx <= b[2] && sy >= b[1] && sy <= b[3]) return n;
    const [x, y] = toScreen(n), d = Math.hypot(sx - x, sy - y);
    if (d < bd){ bd = d; best = n; }
  }
  return best;
}
function flyTo(g){                 // magnify one hub and everything hanging off it
  let x0 = g.tx, x1 = g.tx, y0 = g.ty, y1 = g.ty;
  const grow = n => { x0 = Math.min(x0, n.tx); x1 = Math.max(x1, n.tx); y0 = Math.min(y0, n.ty); y1 = Math.max(y1, n.ty); (n.children || []).forEach(grow); };
  grow(g);
  const z = Math.max(.95, Math.min(1.9, Math.min((W - 260) / (x1 - x0 + 1), (H - 240) / (y1 - y0 + 1))));
  touched = true; camTo = { x: (x0 + x1) / 2, y: (y0 + y1) / 2 + 30 / z, z };
}
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; camTo = null; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (drag){ const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); cam.x -= dx / cam.z; cam.y -= dy / cam.z; drag.x = e.clientX; drag.y = e.clientY; if (drag.moved > 4) { cv.classList.add('drag'); touched = true; } }
  else { hover = pick(e.clientX, e.clientY); cv.classList.toggle('hot', !!hover && (hover === 'orb' || hover.hub || !!hover.id)); }
});
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('pointerup', e => {
  const wasClick = drag && drag.moved <= 4; drag = null; cv.classList.remove('drag');
  if (!wasClick) return;
  const hit = pick(e.clientX, e.clientY);
  if (hit === 'orb') toggleListen();
  else if (hit && hit.hub) flyTo(hit);
  else if (hit && hit.id) { hit.flash = performance.now(); api('POST', '/api/open', { id: hit.id }); }
});
cv.addEventListener('wheel', e => {
  e.preventDefault(); camTo = null; touched = true;
  const before = toWorld(e.clientX, e.clientY);
  cam.z = Math.min(3, Math.max(.25, cam.z * Math.exp(-e.deltaY * (e.ctrlKey ? .012 : .0028))));
  const after = toWorld(e.clientX, e.clientY); cam.x += before.x - after.x; cam.y += before.y - after.y;
}, { passive: false });

/* ---------- drawing ---------- */
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = 900, pts = [];
for (let i = 0; i < N; i++){ const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), t = i * 2.399963; pts.push([Math.cos(t) * r, y, Math.sin(t) * r, Math.random() * 6.28]); }
let spin = 0, prev = 0;
const polar = (r, a) => [Math.cos(a) * r, Math.sin(a) * r];
function frame(ms){
  const t = ms / 1000, dt = Math.min(.05, t - prev || 0); prev = t;
  if (camTo){ cam.x += (camTo.x - cam.x) * .12; cam.y += (camTo.y - cam.y) * .12; cam.z += (camTo.z - cam.z) * .12; }
  const want = mode === 'thinking' ? .22 + .12 * Math.sin(t * 5) : mode === 'idle' ? .04 + .03 * Math.sin(t * 1.2) : Math.max(.06, target);
  level += (want - level) * (want > level ? .45 : .14);
  spin += dt * (mode === 'thinking' ? 1.5 : .22 + level * .6);
  for (const n of flat){ n.x += (n.tx - n.x) * (still ? 1 : .16); n.y += (n.ty - n.y) * (still ? 1 : .16); }

  cx.clearRect(0, 0, W, H);
  cx.save(); cx.translate(W / 2, H / 2); cx.scale(cam.z, cam.z); cx.translate(-cam.x, -cam.y);

  const glow = cx.createRadialGradient(0, 0, 60, 0, 0, 460);
  glow.addColorStop(0, `rgba(255,255,255,${.05 + level * .06})`); glow.addColorStop(1, 'rgba(255,255,255,0)');
  cx.fillStyle = glow; cx.beginPath(); cx.arc(0, 0, 460, 0, 6.283); cx.fill();

  // strands: the ring through the hubs, and each row of neighbours tied together
  const k = 1 / cam.z, r2 = reveal2();
  cx.lineWidth = k;
  cx.strokeStyle = 'rgba(255,255,255,.08)';
  cx.beginPath(); roots.forEach((g, i) => i ? cx.lineTo(g.x, g.y) : cx.moveTo(g.x, g.y)); cx.closePath(); cx.stroke();
  cx.strokeStyle = 'rgba(255,255,255,.055)';
  for (const g of roots) for (const line of g.rows || []) if (line.length > 1){ cx.beginPath(); line.forEach((n, i) => i ? cx.lineTo(n.x, n.y) : cx.moveTo(n.x, n.y)); cx.stroke(); }
  // threads: straight out from the middle
  for (const n of flat){
    const lit = hover === n || (hover && hover !== 'orb' && (n.parent === hover || (n.parent && n.parent.parent === hover)));
    if (n.hub){ cx.strokeStyle = `rgba(255,255,255,${lit ? .55 : .2})`; cx.beginPath(); cx.moveTo(...polar(236, n.a)); cx.lineTo(n.x, n.y); cx.stroke(); }
    else { const al = n.depth === 2 ? r2 : 1; if (al <= 0) continue; cx.strokeStyle = `rgba(255,255,255,${(lit ? .55 : n.depth === 2 ? .16 : .075) * al})`; cx.beginPath(); cx.moveTo(n.parent.x, n.parent.y); cx.lineTo(n.x, n.y); cx.stroke(); }
  }
  // dots and labels. Text stays one size on screen, and a label only shows where it has room,
  // so zooming in pulls things apart and more names appear.
  const taken = [];
  const free = b => !taken.some(t => b[0] < t[2] && b[2] > t[0] && b[1] < t[3] && b[3] > t[1]);
  const order = hover && hover !== 'orb' ? [hover, ...flat.filter(n => n !== hover)] : flat;
  cx.textBaseline = 'middle';
  for (const n of [...order].sort((p, q) => (p === hover ? -1 : q === hover ? 1 : p.depth - q.depth))){
    const vis = n.depth === 2 ? r2 : 1; if (vis <= 0) { n.box = null; n.la = 0; continue; }
    const hot = hover === n, flash = n.flash && ms - n.flash < 450, [sx, sy] = toScreen(n), w = textW(n);
    let box, want;
    if (n.hub) box = [sx - w / 2 - 10, sy - 30, sx + w / 2 + 10, sy + 28];
    else { const right = Math.cos(n.a) >= 0, subW = n.sub && hot ? 70 : 0; box = right ? [sx + 4, sy - 9, sx + 14 + w + subW, sy + 9] : [sx - 14 - w - subW, sy - 9, sx - 4, sy + 9]; }
    want = n.hub || hot || free(box);
    if (want) taken.push(box);
    n.box = box; n.la += ((want ? 1 : 0) - n.la) * (still ? 1 : .2);
    cx.save(); cx.translate(n.x, n.y); cx.scale(k, k); cx.globalAlpha = vis;
    if (n.hub){
      cx.fillStyle = '#000'; cx.strokeStyle = `rgba(255,255,255,${hot ? 1 : .6})`; cx.lineWidth = 1;
      cx.beginPath(); cx.arc(0, 0, hot ? 7.5 : 6, 0, 6.283); cx.fill(); cx.stroke();
      cx.fillStyle = hot ? '#fff' : 'rgba(255,255,255,.85)'; cx.beginPath(); cx.arc(0, 0, 2, 0, 6.283); cx.fill();
      cx.font = FONT_HUB; cx.textAlign = 'center'; try { cx.letterSpacing = '2px'; } catch {}
      cx.fillStyle = hot ? '#fff' : '#e8e8ed'; cx.fillText(shown(n), 1, -19);
      try { cx.letterSpacing = '0px'; } catch {}
      cx.font = FONT_SUB; cx.fillStyle = '#6e6e73'; cx.fillText(n.children.length, 0, 19);
    } else {
      if (n.dim){ cx.strokeStyle = `rgba(255,255,255,${hot ? .9 : .4})`; cx.lineWidth = 1; cx.beginPath(); cx.arc(0, 0, 3, 0, 6.283); cx.stroke(); }
      else { cx.fillStyle = hot || flash ? '#fff' : 'rgba(255,255,255,.85)'; cx.beginPath(); cx.arc(0, 0, hot ? 3.8 : 2.6, 0, 6.283); cx.fill(); }
      if (n.la > .02){
        const d = Math.cos(n.a) >= 0 ? 1 : -1;
        cx.globalAlpha = vis * n.la; cx.textAlign = d > 0 ? 'left' : 'right';
        cx.font = FONT; cx.fillStyle = hot || flash ? '#fff' : n.dim ? '#6e6e73' : '#c7c7cc'; cx.fillText(shown(n), d * 10, 0);
        if (n.sub && (hot || !n.dim)){ cx.font = FONT_SUB; cx.fillStyle = '#86868b'; cx.fillText(n.sub, d * (w + 17), .5); }
      }
    }
    cx.restore();
  }
  cx.globalAlpha = 1;

  // the orb: a sphere of dots
  const R = 108, cs = Math.cos(spin), sn = Math.sin(spin), tilt = .35, ct = Math.cos(tilt), st = Math.sin(tilt);
  for (const p of pts){
    const wob = 1 + level * (.16 + .34 * Math.sin(p[3] + t * 9 + p[1] * 5) * Math.sin(p[3] * 3 - t * 6));
    const x = p[0] * cs + p[2] * sn, z = -p[0] * sn + p[2] * cs, y2 = p[1] * ct - z * st, z2 = p[1] * st + z * ct;
    const k = R * wob, depth = (z2 + 1) / 2, s = .7 + depth * 1.5 + level * 1.2;
    cx.fillStyle = `rgba(255,255,255,${.12 + depth * .8})`;
    cx.fillRect(x * k - s / 2, y2 * k - s / 2, s, s);
  }
  [[152, 120, 1, 22], [176, 72, -1, 12], [204, 180, 1, 5]].forEach(([r, n, dir, amp], ri) => {
    for (let i = 0; i < n; i++){
      const a = i / n * 6.283 + dir * t * (.08 + ri * .05);
      const wave = Math.sin(a * 6 + t * 7 * dir) * .5 + Math.sin(a * 11 - t * 11) * .3 + Math.sin(a * 3 + t * 3) * .2;
      const rr = r + wave * amp * level * 2.2;
      cx.fillStyle = `rgba(255,255,255,${ri === 2 ? .22 : .35 + level * .6})`;
      cx.beginPath(); cx.arc(Math.cos(a) * rr, Math.sin(a) * rr, ri === 2 ? 1 : 1.6 + level * 1.6, 0, 6.283); cx.fill();
    }
  });
  if (mode === 'listening'){ cx.strokeStyle = 'rgba(255,255,255,.85)'; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(0, 0, 226, -Math.PI / 2, -Math.PI / 2 + 6.283 * (.15 + level * .85)); cx.stroke(); }
  cx.restore();
  if (!still) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (still) setInterval(() => frame(performance.now()), 400);

/* ---------- conversation history panel ---------- */
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
async function openHistory(){
  $('drawer').classList.add('open');
  const list = $('hist'); list.textContent = 'Loading';
  try {
    const items = (await api('GET', '/api/history')).items.reverse();
    list.textContent = '';
    if (!items.length) list.innerHTML = '<p class="none">Nothing yet. Everything you ask Jarvis, by voice or text, is kept here.</p>';
    for (const it of items){
      const d = new Date(it.at), el = document.createElement('article');
      el.innerHTML = `<header>${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} · ${d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })} · ${it.channel === 'text' ? 'Text' : 'Jarvis app'}${it.model ? ' · ' + esc(it.model) : ''}</header><p class="u">${esc(it.text)}</p><p>${esc(it.reply)}</p>`;
      list.append(el);
    }
  } catch { list.textContent = 'Could not load the history.'; }
}
$('history').addEventListener('click', () => $('drawer').classList.contains('open') ? $('drawer').classList.remove('open') : openHistory());
$('closeHist').addEventListener('click', () => $('drawer').classList.remove('open'));

/* ---------- status, texts handled, reminders ---------- */
async function tick(){
  try {
    const s = await api('GET', '/api/state?since=' + last);
    voiceName = s.voice || '';
    notice = s.telegram && s.telegram.startsWith('send') ? s.telegram.replace('send', 'Send') : '';
    if (s.working && s.working.model && (mode === 'thinking' || !busy)) { $('status').textContent = 'Thinking · ' + s.working.model; $('pill').classList.add('live'); } else paintStatus();
    if (last && s.notices.some(n => n.kind === 'reload')) { location.reload(); return; }
    if (last) for (const n of s.notices){
      if (n.kind === 'text') { showText(); $('heard').textContent = n.text; $('said').textContent = ''; }
      else if (n.kind === 'reply') { showText(); $('said').textContent = n.text; fadeSoon(9000); }
      else if (n.kind === 'reminder') { showText(); fadeSoon(15000); $('heard').textContent = ''; $('said').textContent = 'Reminder: ' + n.text; if (mode === 'idle') speak('Reminder. ' + n.text); }
    }
    last = s.last;
  } catch { $('status').textContent = 'Offline'; $('pill').classList.remove('live'); }
}
tick(); setInterval(tick, 2000);
